services:
  - type: web
    name: emailcheck
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMAIL_VERIFICATION_PROVIDER
        value: abstract
      - key: EMAIL_VERIFICATION_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_TIMEOUT
        value: 6.0
      - key: ENABLE_SMTP_PROBE
        value: false
      - key: SMTP_PROBE_PORT
        value: 25
      - key: SMTP_PROBE_TIMEOUT
        value: 5
      - key: SMTP_HELO_HOSTNAME
        value: mail.emailcheck.app
      - key: SMTP_PROBE_SENDER
        value: verify@emailcheck.app
      - key: ENABLE_DIRECT_SMTP
        value: false
      - key: MAX_EMAILS_PER_REQUEST
        value: 100
      - key: RATE_LIMIT_REQUESTS
        value: 30
      - key: RATE_LIMIT_WINDOW
        value: 60
